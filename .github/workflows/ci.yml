#
# Runs the full check (typecheck, lint, unit, E2E against the production
# build) on pull requests and on pushes to main.

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    # Pinned: ubuntu-latest is 26.04, which Playwright 1.59 does not support.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm run check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
